<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>ShuttleTV</title>
		<link rel="icon" href="data:," />
	</head>
	<body>
		<!--
			sandbox without `allow-popups` or `allow-top-navigation`: the framed
			site cannot open popunders or replace this page with an ad redirect.
		-->
		<iframe
			id="site"
			title="ShuttleTV"
			sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-orientation-lock allow-pointer-lock allow-presentation"
			allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
			allowfullscreen
			referrerpolicy="no-referrer"
		></iframe>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
